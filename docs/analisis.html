<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de software - Parcial 2</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #009240 0%, #25B322 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container{
            background: #ffffff;
            width: 100%;
            max-width: 750px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.18);
        }

        .header{
            background: linear-gradient(90deg, #009240, #25B322);
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        .header::after{
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: #FFD400;
        }

        .header h1{
            color: white;
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .content{
            padding: 45px 35px;
            background: #f9fbf8;
        }

        .subtitle{
            text-align: center;
            color: #009240;
            font-size: 1.1rem;
            margin-bottom: 35px;
            font-weight: 600;
        }

        ul{
            list-style: none;
        }

        li{
            margin-bottom: 25px;
        }

        a{
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 2px solid #25B322;
            color: #006837;
            padding: 20px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,146,64,0.08);
        }

        a:hover{
            background: #009240;
            color: white;
            transform: translateY(-4px);
            border-color: #009240;
            box-shadow: 0 10px 20px rgba(0,146,64,0.20);
        }

        .footer{
            text-align: center;
            padding: 18px;
            font-size: 0.9rem;
            background: #f1f5f2;
            color: #666;
            border-top: 1px solid #dfe7df;
        }

        @media(max-width: 600px){

            .header h1{
                font-size: 1.7rem;
            }

            .content{
                padding: 30px 20px;
            }

            a{
                font-size: 1rem;
                padding: 16px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Análisis de software<br>Parcial 2</h1>
        </div>

        <div class="content">

            <ul>

                <li>
                    <a href="https://forms.gle/CuiJuTrGTc1GLtii8" target="_blank">
                        INGRESAR
                    </a>
                </li>

            </ul>

        </div>

        <div class="footer">
            Politécnico Colombiano Jaime Isaza Cadavid
        </div>

    </div>

</body>
</html>
